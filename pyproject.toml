[project]
name = "ToolBox"
version = "0.1.0"
description = "Tool box"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pywebio>=1.8",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "requests>=2.34",
    "pillow>=13.0",
    "qrcode>=8.2",
]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["EXE001", "BLE001"]